name: skill-manifest
version: "0.3.0"
description: "Enforces the UPSTREAM_MANIFEST.md rule: watches skill arrivals (created/installed), detects content changes in manifested skills between reviews, and requires fingerprint-bound acknowledgment. Detects manual copies via a session drift probe, lints the manifest, and injects a bounded advisory listing untracked skills."
author: moonlight-lupin
license: MIT
homepage: https://github.com/moonlight-lupin/agent-skills/tree/main/plugins/skill-manifest
tags: [skills, manifest, drift, governance, plugin]
requires_hermes: ">=0.21.1"
provides_hooks:
  - on_skill_lifecycle
  - on_session_start
  - pre_llm_call
config_schema:
  manifest_filename:
    type: str
    default: "UPSTREAM_MANIFEST.md"
    description: "Manifest filename relative to the skills root"
  skills_root:
    type: str
    default: ""
    description: "Skills directory. Empty uses the Hermes home skills directory."
  disabled:
    type: bool
    default: false
    description: "When true, every hook returns immediately and does no I/O"
  max_reported:
    type: int
    default: 6
    description: "Pending names shown per advisory. The rest are +N more."
  dismissed:
    type: list
    default: []
    description: "Skill names treated as originals (no manifest row needed)."
  auto_resolve:
    type: bool
    default: true
    description: "When true, ensure one unpinned drift-clearance cron. When false, do not create or recreate it."
  auto_resolve_schedule:
    type: str
    default: "0 9 * * *"
    description: "Cron schedule for the drift-clearance job."
  auto_resolve_deliver:
    type: str
    default: "telegram"
    description: "Delivery target for the drift-clearance job. An empty string omits deliver."
  track_changes:
    type: bool
    default: true
    description: "When true, fingerprint manifested skills and report content changes between reviews."
  scan_budget_s:
    type: number
    default: 5.0
    description: "Seconds allowed for per-skill fingerprinting each probe; the rest defer."
  max_files_per_skill:
    type: int
    default: 400
    description: "Files hashed per skill when fingerprinting content."
  max_bytes_per_skill:
    type: int
    default: 8000000
    description: "Content bytes hashed per skill when fingerprinting."

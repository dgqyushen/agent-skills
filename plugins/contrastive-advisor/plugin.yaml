name: contrastive-advisor
version: 0.3.0
description: "Advisory reminder when a behavioral skill edit lands without a probe cycle; self-installs a fire-clearance cron and bundles the contrastive-refinement skill."
author: "moonlight-lupin"
license: MIT
requires_hermes: ">=0.21.1"
provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - on_session_start
config_schema:
  settings:
    type: object
    properties:
      enabled: {type: boolean}
      probe_root: {type: string}
      excluded_skills: {type: array}
      markers:
        type: array
        items: {type: string}
      ttl_minutes: {type: number}
      ledger_enabled: {type: boolean}
      sweeper: {type: boolean}
      sweeper_schedule: {type: str}
      sweeper_deliver: {type: str}